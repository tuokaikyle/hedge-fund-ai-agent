[project]
name = "simple-hedge-fund"
version = "0.1.0"
description = "A small CLI app for learning how agent-style stock analysis systems are structured."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "typer>=0.16.0",
    "yfinance>=0.2.54",
]

[project.scripts]
simple-hedge-fund = "simple_hedge_fund.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/simple_hedge_fund"]
