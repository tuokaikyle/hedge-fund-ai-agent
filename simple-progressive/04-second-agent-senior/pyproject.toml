[project]
name = "simple-hedge-fund"
version = "0.4.0"
description = "Lesson 4: second agent (Senior), a multi-metric heuristic"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_hedge_fund"]
